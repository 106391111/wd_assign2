
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ScreenSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="index.html">ScreenSpot</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a class="active" href="register.html">Register</a></li>
                <li><a href="booking.html">Book Tickets</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">JOIN OUR MOVIE COMMUNITY</p>
            <h1>Create Your Account</h1>
            <p>Complete the form to register with ScreenSpot.</p>
        </section>

        <section class="register-section section">
            <form id="register-form" class="register-form" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           autocomplete="username" required>
                    <small class="field-error" id="username-error"></small>
                </div>

                <div class="form-group">
                    <label for="register-email">Email address</label>
                    <input type="email" id="register-email" name="email"
                           autocomplete="email" required>
                    <small class="field-error" id="register-email-error"></small>
                </div>

                <div class="form-group">
                    <label for="register-phone">Phone number</label>
                    <input type="tel" id="register-phone" name="phone"
                           autocomplete="tel" required>
                    <small class="field-error" id="register-phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="new-password" required>
                    <small class="field-error" id="password-error"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password"
                           name="confirmPassword"
                           autocomplete="new-password" required>
                    <small class="field-error" id="confirm-password-error"></small>
                </div>

                <fieldset class="form-group">
                    <legend>Gender</legend>

                    <label class="choice-label">
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label class="choice-label">
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label class="choice-label">
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>

                    <label class="choice-label">
                        <input type="radio" name="gender" value="Prefer not to say">
                        Prefer not to say
                    </label>

                    <small class="field-error" id="gender-error"></small>
                </fieldset>

                <fieldset class="form-group">
                    <legend>Preferred movie genres</legend>
                    <p class="help-text">Select at least one genre.</p>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Action">
                        Action
                    </label>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Comedy">
                        Comedy
                    </label>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Science Fiction">
                        Science Fiction
                    </label>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Drama">
                        Drama
                    </label>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Animation">
                        Animation
                    </label>

                    <label class="choice-label">
                        <input type="checkbox" name="genres" value="Thriller">
                        Thriller
                    </label>

                    <small class="field-error" id="genres-error"></small>
                </fieldset>

                <div class="form-group">
                    <label for="country">Country/Region</label>
                    <select id="country" name="country" required>
                        <option value="">Select your country/region</option>
                        <option value="Australia">Australia</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="India">India</option>
                        <option value="Malaysia">Malaysia</option>
                        <option value="New Zealand">New Zealand</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="United States">United States</option>
                        <option value="Other">Other</option>
                    </select>
                    <small class="field-error" id="country-error"></small>
                </div>

                <p id="register-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn">Create Account</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 ScreenSpot. Student web development project.</p>
    </footer>
</body>
</html>
